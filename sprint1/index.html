<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>판다마켓</title>
    <meta name="description" content="판다마켓" />
    <meta
      name="keywords"
      content="판다마켓, 중고거래, 중고상품, 판매, 구매, 거래"
    />
    <meta name="language" content="ko" />
    <link
      rel="stylesheet"
      as="style"
      crossorigin
      href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.8/dist/web/variable/pretendardvariable.css"
    />
    <link rel="stylesheet" href="assets/css/styles.css" />
    <script
      src="https://kit.fontawesome.com/cb78d3541b.js"
      crossorigin="anonymous"
    ></script>
  </head>
  <body>
    <!-- 헤더 -->
    <header class="header">
      <div class="navbar">
        <!-- 로고 -->
        <div class="logo">
          <a href="/">
            <img src="/assets/images/logo.png" alt="판다마켓 로고" />
            판다마켓
          </a>
        </div>
        <!-- 버튼 -->
        <div class="nav">
          <!-- 로그인 버튼 -->
          <a class="login-btn" href="/login.html" button>로그인</a>
        </div>
      </div>
    </header>
    <!-- 메인 -->
    <main class="main">
      <!-- 탑 섹션 -->
      <section class="top-section">
        <div class="banner">
          <div class="banner-text">
            <h2>일상의 모든 물건을 <br />거래해 보세요</h2>
            <a class="items-btn" href="/items.html" button>구경하러 가기</a>
          </div>
          <img src="/assets/images/Img_home_top.png" alt="판다마켓 배너" />
        </div>
      </section>
      <!-- 센터 섹션 -->
      <section class="center-section">
        <div class="card">
          <img src="/assets/images/Img_home_01.png" alt="인기 상품" />
          <div class="card-text">
            <span>Hot item</span>
            <h2>
              인기 상품을 <br />
              확인해 보세요
            </h2>
            <h6>
              가장 HOT한 중고거래 물품을
              <br />
              판다 마켓에서 확인해 보세요
            </h6>
          </div>
        </div>
      </section>
      <section class="center-section">
        <div class="card">
          <div class="card-text text-left">
            <span>Search</span>
            <h2>
              구매를 원하는<br />
              상품을 검색하세요
            </h2>
            <h6>구매하고 싶은 물품은 검색해서<br />쉽게 찾아보세요</h6>
          </div>
          <img src="/assets/images/Img_home_02.png" alt="상품 검색" />
        </div>
      </section>
      <section class="center-section">
        <div class="card">
          <img src="/assets/images/Img_home_03.png" alt="상품 등록" />
          <div class="card-text">
            <span>Register</span>
            <h2>판매를 원하는<br />상품을 등록하세요</h2>
            <h6>어떤 물건이든 판매하고 싶은 상품을<br />쉽게 등록하세요</h6>
          </div>
        </div>
      </section>
      <section class="bottom-section">
        <div class="banner bottom-banner">
          <div class="banner-text">
            <h2>믿을 수 있는 <br />판다마켓 중고 거래</h2>
          </div>
          <img src="/assets/images/Img_home_bottom.png" alt="판다마켓 배너" />
        </div>
      </section>
    </main>
    <!-- 푸터 -->
    <footer class="footer">
      <div class="footer-content">
        <div class="copyright">©codeit - 2024</div>
        <div class="footer-btn">
          <a href="/privacy.html">Privacy Policy</a>
          <a href="/faq.html">FAQ</a>
        </div>
        <div class="icons">
          <a href="https://www.facebook.com" target="_blank">
            <i class="fa-brands fa-facebook"></i>
          </a>
          <a href="https://www.twitter.com" target="_blank">
            <i class="fa-brands fa-twitter"></i>
          </a>
          <a href="https://www.youtube.com" target="_blank">
            <i class="fa-brands fa-youtube"></i>
          </a>
          <a href="https://www.instagram.com" target="_blank">
            <i class="fa-brands fa-instagram"></i>
          </a>
        </div>
      </div>
    </footer>
  </body>
</html>
