<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>판다마켓</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="login-container">
      <form class="login-form">
        <img
          src="assets/login-logo.png"
          alt="로그인 화면 판다마켓 로고"
          class="login-logo"
        />
        <label for="email">이메일</label>
        <input
          type="email"
          id="email"
          name="email"
          placeholder="이메일"
          class="login-input"
        />
        <label for="password">비밀번호</label>
        <input
          type="password"
          id="password"
          name="password"
          placeholder="비밀번호"
          class="login-input"
        />
        <button class="login-button" type="submit">로그인</button>
        <div class="social-login">
          <p>간편 로그인하기</p>
          <ul class="social-login-container">
            <li>
              <a href="">
                <img src="assets/google-icon.png" alt="구글 로그인" />
              </a>
            </li>
            <li>
              <a href=""
                ><img src="assets/kakao-icon.png" alt="카카오 로그인"
              /></a>
            </li>
          </ul>
        </div>
        <p class="login-signup">
          판다마켓이 처음이신가요? <a href="signup.html">회원가입</a>
        </p>
      </form>
    </div>
  </body>
</html>
