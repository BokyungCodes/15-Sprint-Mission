<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>판다마켓</title>
    <link rel="stylesheet" href="style.css" />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/reset-css@4.0.1/reset.min.css"
    />
    <script
      src="https://kit.fontawesome.com/0f08ea7d4a.js"
      crossorigin="anonymous"
    ></script>
  </head>
  <body>
    <div class="login-container">
      <form class="login-form">
        <div class="login-header">
          <a href="">
            <img
              src="assets/login-logo.png"
              alt="로그인 화면 판다마켓 로고"
              class="login-logo"
            />
          </a>
        </div>

        <div class="login-input-container">
          <label for="email">이메일</label>
          <input
            type="email"
            id="email"
            name="email"
            placeholder="이메일"
            class="login-input"
            aria-label="이메일 입력"
          />
        </div>

        <div class="login-input-container">
          <label for="password">비밀번호</label>
          <input
            type="password"
            id="password"
            name="password"
            placeholder="비밀번호"
            class="login-input"
            aria-label="비밀번호 입력"
          />
        </div>

        <button class="login-button" type="submit">로그인</button>

        <div class="social-login-container">
          <p>간편 로그인하기</p>
          <ul class="social-login-icons">
            <li>
              <a href="https://www.google.com" aria-label="구글 로그인">
                <img
                  src="assets/google-icon.png"
                  alt="구글 로그인"
                  class="social-login-icon"
                />
              </a>
            </li>
            <li>
              <a href="https://www.kakao.com" aria-label="카카오 로그인">
                <img
                  src="assets/kakao-icon.png"
                  alt="카카오 로그인"
                  class="social-login-icon"
                />
              </a>
            </li>
          </ul>
        </div>

        <div class="login-footer-container">
          <p class="login-signup">
            판다마켓이 처음이신가요?
            <a href="signup.html" class="signup-link">회원가입</a>
          </p>
        </div>
      </form>
    </div>
  </body>
</html>
