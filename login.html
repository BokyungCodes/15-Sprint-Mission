<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" href="icon-img/panda-face.png" />
    <title>로그인</title>
    <link
      rel="stylesheet"
      crossorigin
      href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css"
    />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/normalize/8.0.1/normalize.min.css"
    />
    <link rel="stylesheet" href="login-style.css" />
  </head>
  <body>
    <header>
      <a href="/login.html">
        <img src="icon-img/loginLogo.svg" alt="판다마켓 로고" />
      </a>
    </header>
    <main>
      <form action="/login" method="POST">
        <div class="email-page">
          <label for="signup-email">이메일</label>
          <input id="signup-email" name="email" type="email" required />
        </div>
        <div class="password-page">
          <label for="signup-password">비밀번호</label>
          <input
            id="signup-password"
            name="password"
            type="password"
            required
          />
        </div>
        <button class="login-button" type="submit">로그인</button>
      </form>
      <div class="quick-login">
        <div class="title">간편 로그인하기</div>
        <div class="buttons">
          <a href="https://www.google.com/">
            <img src="icon-img/Component 2.svg" alt="구글 아이콘" />
          </a>
          <a href="https://www.kakaocorp.com/page/">
            <img src="icon-img/kakao.svg" alt="카카오 아이콘" />
          </a>
        </div>
      </div>
    </main>
    <footer>
      <div>판다마켓이 처음이신가요? <a href="signup.html">회원가입</a></div>
    </footer>
  </body>
</html>
