<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>판다마켓</title>
    <link rel="stylesheet" href="style.css" />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/reset-css@4.0.1/reset.min.css"
    />
    <script
      src="https://kit.fontawesome.com/0f08ea7d4a.js"
      crossorigin="anonymous"
    ></script>
  </head>
  <body>
    <!-- Header -->
    <header>
      <nav>
        <div class="nav-container">
          <a href="/" class="nav-logo">
            <img
              src="assets/nav-logo.png"
              alt="판다마켓 로고"
              class="nav-logo-img"
            />
          </a>
          <div class="nav-login-button">
            <a href="login.html">로그인</a>
          </div>
        </div>
      </nav>
      <section class="hero">
        <div class="hero-container">
          <div class="hero-text-container">
            <h1 class="hero-title">일상의 모든 물건을<br />거래해 보세요</h1>
            <a href="/items.html" class="hero-button"> 구경하러 가기 </a>
          </div>
          <div class="hero-image-container">
            <img
              src="assets/header-hero.png"
              alt="판다마켓 헤더 히어로 이미지"
              class="hero-image"
            />
          </div>
        </div>
      </section>
    </header>
    <!-- Main Content -->
    <main class="main-container">
      <section class="feature-container">
        <div>
          <img
            src="assets/feature1.png"
            alt="인기 상품 확인"
            class="feature-image"
          />
        </div>
        <div class="feature-text-container">
          <p class="feature-category">Hot item</p>
          <h1 class="feature-title">인기 상품을<br />확인해 보세요</h1>
          <p class="feature-description">
            가장 HOT한 중고거래 물품을<br />판다 마켓에서 확인해보세요
          </p>
        </div>
      </section>
      <section class="feature-container right">
        <div class="feature-text-container">
          <p class="feature-category">Search</p>
          <h1 class="feature-title">구매를 원하는<br />상품을 검색하세요</h1>
          <p class="feature-description">
            구매하고 싶은 물품은 검색해서<br />쉽게 찾아보세요
          </p>
        </div>
        <div>
          <img
            src="assets/feature2.png"
            alt="인기 상품 확인"
            class="feature-image"
          />
        </div>
      </section>
      <section class="feature-container">
        <div>
          <img
            src="assets/feature1.png"
            alt="인기 상품 확인"
            class="feature-image"
          />
        </div>
        <div class="feature-text-container">
          <p class="feature-category">Register</p>
          <h1 class="feature-title">판매를 원하는<br />상품을 등록하세요</h1>
          <p class="feature-description">
            어떤 물건이든 판매하고 싶은 상품을<br />쉽게 등록하세요
          </p>
        </div>
      </section>
    </main>
    <footer>
      <section class="hero">
        <div class="hero-container">
          <div class="hero-text-container">
            <h1 class="hero-title">믿을 수 있는<br />판다마켓 중고 거래</h1>
          </div>
          <div class="hero-image-container">
            <img
              src="assets/footer-hero.png"
              alt="판다마켓 푸터 히어로 이미지"
              class="hero-image"
            />
          </div>
        </div>
      </section>
      <section class="footer-container">
        <div class="footer-content">
          <div class="footer-copyright copyright">
            <p>©codeit - 2024</p>
          </div>
          <div class="footer-links">
            <a href="/privacy.html">Privacy Policy</a>
            <a href="/faq.html">FAQ</a>
          </div>
          <div>
            <ul class="footer-social">
              <li class="social-icons">
                <a href="#">
                  <i class="fa-brands fa-facebook"></i>
                </a>
              </li>
              <li class="social-icons">
                <a href="#">
                  <i class="fa-brands fa-twitter"></i>
                </a>
              </li>
              <li class="social-icons">
                <a href="#"><i class="fa-brands fa-youtube"></i></a>
              </li>
              <li class="social-icons">
                <a href="#"><i class="fa-brands fa-instagram"></i></a>
              </li>
            </ul>
          </div>
        </div>
      </section>
    </footer>
  </body>
</html>
