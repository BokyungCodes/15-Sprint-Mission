<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>판다마켓</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <div class="gnb wrap">
      <a href="/" class="logo">
        <img src="./images/Property 1=sm.png" alt="판다마켓 로고">
      </a>
      <a href="/login" class="btn-login Text-lg semibold">로그인</a>
    </div>
  </header>

  <main>
    <section class="home-top">
      <div class=".wrap">
        <p class="text-4xl bold">
          일상의 모든 물건을 <br>
          거래해 보세요
        </p>
        <a href="/items" class="btn-large text-xl semibold">구경하러 가기</a>
        <img src="./images/Img_home_top.png" alt="판다 이미지">
      </div>
    </section>

    <section class="home">
      <div class="home-1">
        <div class="home-1-content">
          <img src="./images/Img_home_01.png" alt="인기 상품">
          <p class="text-2lg bold">
            Hot item
          </p>
          <p class="text-4xl bold">
            인기 상품을<br>
            확인해 보세요
          </p>
          <p class="text-2xl medium">
            가장 HOT한 중고거래 물품을<br>
            판다 마켓에서 확인해 보세요
          </p>
        </div>
      </div>
      <div class="home-2">
        <div class="home-2-content">
          <p class="text-2lg bold">
            Search
          </p>
          <p class="text-4xl bold">
            구매를 원하는<br>
            상품을 검색하세요
          </p>
          <p class="text-2xl medium">
            구매하고 싶은 물품은 검색해서<br>
            쉽게 찾아보세요
          </p>
          <img src="./images/Img_home_02.png" alt="상품 검색">
        </div>
      </div>
      <div class="home-3">
        <div class="home-3-content">
          <img src="./images/Img_home_03.png" alt="상품 등록">
          <p class="text-2lg bold">
            Register
          </p>
          <p class="text-4xl bold">
            판매를 원하는<br>
            상품을 등록하세요
          </p>
          <p class="text-2xl medium">
            어떤 물건이든 판매하고 싶은 상품을<br>
            쉽게 등록하세요
          </p>
        </div>
      </div>
    </section> 

    <section class="home-bottom">
      <p class="text-4xl bold">
        믿을 수 있는 <br>
        판다마켓 중고 거래
      </p>
      <img src="./images/Img_home_bottom.png" alt="판다 이미지">
    </section>
  </main>

  <footer>
    <div class="footer-content">
      <p class="copyright">@codeit - 2024</p>
      <div class="faq"> 
        <a href="/privacy">Privacy Policy</a>
        <a href="/faq">FAQ</a>
      </div>
      <div class="sns">
        <a href="https://facebook.com" target="_blank">
          <img src="./images/ic_facebook.png" alt="페이스북">
        </a>
        <a href="https://twitter.com" target="_blank">
          <img src="./images/ic_twitter.png" alt="트위터">
        </a>
        <a href="https://youtube.com" target="_blank">
          <img src="./images/ic_youtube.png" alt="유튜브">
        </a>
        <a href="https://instagram.com" target="_blank">
          <img src="./images/ic_instagram.png" alt="인스타그램">
        </a>
      </div>
    </div>
  </footer>
</body>
</html>
