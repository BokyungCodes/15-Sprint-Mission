<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" href="icon-img/panda-face.png" />
    <title>회원가입</title>
    <link
      rel="stylesheet"
      crossorigin
      href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css"
    />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/normalize/8.0.1/normalize.min.css"
    />
    <link rel="stylesheet" href="signup.css" />
  </head>
  <body>
    <header>
      <a href="/index.html">
        <img src="icon-img/loginLogo.svg" alt="판다마켓 로고" />
      </a>
    </header>
    <main>
      <form>
        <div class="email-page">
          <label for="signup-email">이메일</label>
          <input id="signup-email" name="email" type="email" />
        </div>
        <div class="name-page">
          <label for="signup-name">닉네임</label>
          <input id="signup-name" name="name" type="text" />
        </div>
        <div class="password-page">
          <label for="signup-password">비밀번호</label>
          <input id="signup-password" name="password" type="password" />
          <img
            class="password-eye"
            src="icon-img/closed-eye.svg"
            alt="눈에 사선이 쳐진 아이콘"
          />
        </div>
        <div class="password-repeat-page">
          <label for="signup-password-repeat">비밀번호 확인</label>
          <input
            id="signup-password-repeat"
            name="password-repeat"
            type="password"
          />
          <img
            class="password-eye"
            src="icon-img/eye.svg"
            alt="눈 모양 아이콘"
          />
        </div>
        <button class="login-button" type="submit">회원가입</button>
      </form>
      <div class="quick-login">
        <div class="title">간편 로그인하기</div>
        <div class="buttons">
          <a href="https://www.google.com/">
            <img src="icon-img/google.svg" alt="구글 아이콘" />
          </a>
          <a href="https://www.kakaocorp.com/page/">
            <img src="icon-img/kakao.svg" alt="카카오 아이콘" />
          </a>
        </div>
      </div>
    </main>
    <footer>
      <div>이미 회원이신가요? <a href="login.html">로그인</a></div>
    </footer>
  </body>
</html>
